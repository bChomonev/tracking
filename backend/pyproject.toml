[project]
name = "corridor"
version = "0.1.0"
description = "Football Performance Corridor & Effort Engine — post-match batch audit pipeline"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=3.31.0",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corridor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: requires a running Postgres + pgvector (docker compose up -d)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "NPY"]
